<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Общая ферма</title>
  <link rel="stylesheet" href="farm.css">
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script src="terrain.js" defer></script>
  <script src="farm.js" defer></script>
</head>
<body>
  <main>
    <header class="masthead">
      <h1>Общая ферма</h1>
      <button id="refresh" type="button">Обновить</button>
      <p id="wallet"></p>
    </header>
    <nav id="navigation" aria-label="Разделы фермы" hidden>
      <button type="button" data-page="map" aria-current="page">Карта</button>
      <button type="button" data-page="shop">Магазин</button>
      <button type="button" data-page="market">Рынок</button>
      <button type="button" data-page="coop">Кооператив</button>
    </nav>
    <p id="notice" role="status" aria-live="polite">Загружаем ферму...</p>
    <div id="content" hidden></div>
    <dialog id="confirm" aria-labelledby="confirm-title">
      <h2 id="confirm-title">Подтвердите действие</h2>
      <p id="confirm-copy"></p>
      <p id="confirm-error" role="alert" hidden></p>
      <div class="controls">
        <button id="yes" class="primary" type="button">Подтвердить</button>
        <button id="no" type="button">Отмена</button>
      </div>
    </dialog>
  </main>
</body>
</html>
