# Values live in the Bitwarden Secrets Manager project `homelab` and never in this repo.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bidlobot-secrets
  namespace: bidlobot
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: bidlobot-secrets
    deletionPolicy: Retain
  data:
    - secretKey: TG_BOT_TOKEN
      remoteRef:
        key: bidlobot-tg-bot-token
    - secretKey: BOT_OWNER_ID
      remoteRef:
        key: bidlobot-bot-owner-id
    - secretKey: DEEPSEEK_API_KEY
      remoteRef:
        key: bidlobot-deepseek-api-key
